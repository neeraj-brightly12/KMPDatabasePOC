name: PR Review Bot

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  pr-check:
    name: PR Validation
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Check PR title
      uses: amannn/action-semantic-pull-request@v5
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        types: |
          feat
          fix
          docs
          style
          refactor
          perf
          test
          build
          ci
          chore
          revert
        requireScope: false

    - name: Check branch name
      run: |
        BRANCH_NAME="${{ github.head_ref }}"
        if [[ ! $BRANCH_NAME =~ ^(feature|bugfix|hotfix|release)/.+ ]]; then
          echo "::error::Branch name must start with feature/, bugfix/, hotfix/, or release/"
          exit 1
        fi

    - name: Check PR size
      uses: actions/github-script@v7
      with:
        script: |
          const { data: files } = await github.rest.pulls.listFiles({
            owner: context.repo.owner,
            repo: context.repo.repo,
            pull_number: context.issue.number,
          });

          const additions = files.reduce((sum, file) => sum + file.additions, 0);
          const deletions = files.reduce((sum, file) => sum + file.deletions, 0);
          const totalChanges = additions + deletions;

          let label = '';
          let comment = '';

          if (totalChanges < 50) {
            label = 'size/XS';
            comment = '✅ This PR is extra small and easy to review!';
          } else if (totalChanges < 200) {
            label = 'size/S';
            comment = '✅ This PR is small and manageable.';
          } else if (totalChanges < 500) {
            label = 'size/M';
            comment = '⚠️ This PR is medium sized. Consider breaking it down if possible.';
          } else if (totalChanges < 1000) {
            label = 'size/L';
            comment = '⚠️ This PR is large. Please consider breaking it into smaller PRs.';
          } else {
            label = 'size/XL';
            comment = '❌ This PR is very large! Please break it down into smaller, focused PRs.';
          }

          await github.rest.issues.addLabels({
            owner: context.repo.owner,
            repo: context.repo.repo,
            issue_number: context.issue.number,
            labels: [label]
          });

          await github.rest.issues.createComment({
            owner: context.repo.owner,
            repo: context.repo.repo,
            issue_number: context.issue.number,
            body: `## 📊 PR Size Analysis\n\n${comment}\n\n**Changes:** +${additions} -${deletions} (Total: ${totalChanges} lines)\n**Files changed:** ${files.length}`
          });

  code-review:
    name: Automated Code Review
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Review Kotlin code
      uses: actions/github-script@v7
      with:
        script: |
          const { data: files } = await github.rest.pulls.listFiles({
            owner: context.repo.owner,
            repo: context.repo.repo,
            pull_number: context.issue.number,
          });

          const kotlinFiles = files.filter(f => f.filename.endsWith('.kt'));
          let issues = [];

          for (const file of kotlinFiles) {
            if (file.patch) {
              const lines = file.patch.split('\n');

              // Check for TODO comments
              const todos = lines.filter(line => line.includes('TODO'));
              if (todos.length > 0) {
                issues.push(`⚠️ Found ${todos.length} TODO comment(s) in ${file.filename}`);
              }

              // Check for println/print statements
              const debugPrints = lines.filter(line => line.includes('println') || line.includes('print('));
              if (debugPrints.length > 0) {
                issues.push(`⚠️ Found ${debugPrints.length} debug print statement(s) in ${file.filename}`);
              }

              // Check for hardcoded strings (basic check)
              const hardcodedStrings = lines.filter(line =>
                line.includes('Text("') && !line.includes('stringResource')
              );
              if (hardcodedStrings.length > 3) {
                issues.push(`💡 Consider using string resources in ${file.filename}`);
              }
            }
          }

          if (issues.length > 0) {
            const body = `## 🤖 Automated Code Review\n\n${issues.map(i => `- ${i}`).join('\n')}\n\n*This is an automated review. Please review these suggestions.*`;

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: body
            });
          }

  test-coverage:
    name: Test Coverage Check
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v5
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Run tests with coverage
      run: ./gradlew test koverXmlReport || true

    - name: Comment coverage report
      uses: actions/github-script@v7
      with:
        script: |
          await github.rest.issues.createComment({
            owner: context.repo.owner,
            repo: context.repo.repo,
            issue_number: context.issue.number,
            body: '✅ Test coverage report generated. Check artifacts for details.'
          });